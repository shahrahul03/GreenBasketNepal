server:
  port: ${PORT:8080}

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: GreenBasketHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    access-token-secret: ${JWT_ACCESS_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-secret: ${JWT_REFRESH_SECRET}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 5242880
    allowed-extensions: jpg,jpeg,png,webp
  email:
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@greenbasketnepal.com}}
    admin-email: ${ADMIN_EMAIL:admin@greenbasketnepal.com}
    frontend-url: ${FRONTEND_URL}
  openapi:
    server-url: ${API_SERVER_URL:https://api.greenbasket.com.np}
    server-description: Production API Server
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.greenbasket: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
