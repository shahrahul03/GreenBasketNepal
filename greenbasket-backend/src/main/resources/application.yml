server:
  port: 8080

spring:
  application:
    name: green-basket-nepal

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/green_basket_nepal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kathmandu}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: GreenBasketHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
    schemas: green_basket_nepal

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:rahulvelox33@gmail.com}
    password: ${MAIL_PASSWORD:ppedzcxejjafrvha}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    access-token-secret: ${JWT_ACCESS_SECRET:ZGV2LWFjY2Vzcy1zZWNyZXQtZm9yLWdyZWVuLWJhc2tldC1uZXBhbC1vbmx5}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-secret: ${JWT_REFRESH_SECRET:ZGV2LXJlZnJlc2gtc2VjcmV0LWZvci1ncmVlbi1iYXNrZXQtbmVwYWwtb25seQ==}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  google:
    client-id: ${GOOGLE_CLIENT_ID:181403238893-dnj91o8aihf69ii094avtu1ua0oafno7.apps.googleusercontent.com}

  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 5242880
    allowed-extensions: jpg,jpeg,png,webp

  email:
    from: ${MAIL_FROM:${MAIL_USERNAME:rahulvelox33@gmail.com}}
    admin-email: ${ADMIN_EMAIL:admin@greenbasketnepal.com}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

  openapi:
    server-url: ${API_SERVER_URL:http://localhost:8080}
    server-description: ${API_SERVER_DESCRIPTION:Local Development}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.greenbasket: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    com.greenbasket: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.greenbasket: WARN
